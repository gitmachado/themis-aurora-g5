services:
  postgres:
    image: postgres:17-alpine
    container_name: omniconnect-postgres
    environment:
      POSTGRES_DB: omniconnect_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d omniconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: omniconnect-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: omniconnect_db
      JWT_SECRET: your_jwt_secret_here
      JWT_EXPIRE_IN: 7d
      BOT_API_KEY: your_bot_api_key_here
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - server_uploads:/app/uploads
      - server_temp:/app/temp
    command: npm run dev

volumes:
  postgres_data:
  server_node_modules:
  server_uploads:
  server_temp:
