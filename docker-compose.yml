services:
  postgres:
    image: postgres:17-alpine
    container_name: omniconnect-postgres
    env_file:
      - ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./server/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: omniconnect-server
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./server/.env
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - server_uploads:/app/uploads
      - server_temp:/app/temp
    command: sh -c "npm run dev"

volumes:
  postgres_data:
  server_node_modules:
  server_uploads:
  server_temp:
