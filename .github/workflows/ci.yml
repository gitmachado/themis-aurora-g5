name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Validate commit messages
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            npx commitlint --last
          elif ! git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null; then
            # Force-push: the previous tip no longer exists in the repo, so the
            # range is invalid. Fall back to validating only the new tip; the
            # full range is still validated on the corresponding pull_request.
            echo "Previous SHA ${{ github.event.before }} not found (force-push). Falling back to --last."
            npx commitlint --last
          else
            npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}"
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Use pgvector image (matches docker-compose.yml). The default
        # postgres:17-alpine doesn't ship the `vector` extension, which the
        # schema requires for RAG embeddings.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Create CI env file
        run: |
          cat > .env <<'EOF'
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=themis_db
          NODE_ENV=test
          PORT=3000
          CORS_ORIGIN=http://localhost:3000
          JWT_SECRET=ci_jwt_secret
          JWT_EXPIRE_IN=7d
          BOT_API_KEY=ci_bot_api_key
          POSTGRES_DB=themis_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          EOF

      - name: TypeScript build
        run: npm run build

      - name: Setup database
        run: npm run db:setup

      - name: Run migrations
        run: npm run db:migrate

      - name: Run backend tests
        run: npm test

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Docker env file
        working-directory: server
        run: |
          cat > .env <<'EOF'
          DB_HOST=postgres
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=themis_db
          NODE_ENV=test
          PORT=3000
          CORS_ORIGIN=http://localhost:3000
          JWT_SECRET=ci_jwt_secret
          JWT_EXPIRE_IN=7d
          BOT_API_KEY=ci_bot_api_key
          POSTGRES_DB=themis_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          EOF

      - name: Create stub ai/.env
        # The compose file declares an `ai` service that references ./ai/.env
        # via env_file. Even when the service is not started, `docker compose
        # down -v` parses every service definition and fails when the file is
        # missing. A stub satisfies the parser without running the AI service.
        run: |
          mkdir -p ai
          touch ai/.env

      - name: Build and start Docker stack
        run: docker compose up -d --build postgres server

      - name: Wait for API healthcheck
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi

            docker compose ps
            sleep 2
          done

          docker compose logs server
          exit 1

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
